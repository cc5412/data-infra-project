# =============================================================================
#  project.toml · YOUR PROJECT SETTINGS
#  This is the only file you edit. pipeline.py reads it and does the rest.
#
#  Rules of the format:
#   - Text goes in "double quotes". Lists go in [square brackets].
#   - Lines starting with # are notes for people; the computer ignores them.
#   - SQL that spans several lines goes between triple quotes: """ ... """
#
#  This example: NYC 311 heat and hot water complaints from the last 7 days.
#  To see any API's columns before filling this in, run:  python pipeline.py --preview
# =============================================================================

#short name: lowercase, no spaces

[project]
name = "nyc_crashes"

# -----------------------------------------------------------------------------
# 1. SOURCE: where the data comes from
# -----------------------------------------------------------------------------
[source]
type = "socrata"                # "socrata" for NYC Open Data and most city portals,
                                # "worldbank" for the World Bank (see examples/)

# The API address: on the dataset's page, click Export (or API) and copy the
# "API Endpoint" ending in .json
url = "https://data.cityofnewyork.us/resource/h9gi-nx95.json"

# The columns to keep (use the names that --preview shows you)
columns = ["crash_date", "borough", "zip_code", "latitude", "longitude", "on_street_name", "number_of_persons_injured", "number_of_persons_killed", "number_of_pedestrians_killed", "number_of_cyclist_killed", "number_of_motorist_killed", "collision_id"]

# Optional: only some rows. Leave as "" to take everything.
# filter = "complaint_type = 'HEAT/HOT WATER'"

# Optional: only recent rows. Remove these two lines to take all dates.
date_column = "crash_date"
days_back = 30

max_rows = 20000                # a safety limit on how many rows to fetch


# -----------------------------------------------------------------------------
# 2. CHECKS: the rules that define "ready" (at least five)
#    The data arrives in a table called raw.
#    Each check is SQL that COUNTS PROBLEM ROWS. 0 problems = PASS.
#    If any check fails, the run stops and nothing is published.
# -----------------------------------------------------------------------------
[[checks]]
name = "completeness: crash_date is not missing"
why  = "Missing crash dates would not allow analysis of collisions over time or to be able to assign them to a specific reporting period."
sql  = "SELECT count(*) FROM raw WHERE crash_date IS NULL"

[[checks]]
name = "keys unique: collision_id is unique"
why  = "Duplicate collision IDs could cause crashes to be counted more than once, inflating collision totals and related statistics."
sql  = "SELECT count(*) - count(DISTINCT collision_id) FROM raw"

[[checks]]
name = "valid range: injury and fatality counts are nonnegative"
why  = "Negative injury or fatality counts would be errors and distort calculations of the number of people injured or killed."
sql  = """
SELECT count(*) FROM raw
        WHERE number_of_persons_injured < 0
        OR number_of_persons_killed < 0
        OR number_of_pedestrians_killed < 0
        OR number_of_cyclist_killed < 0
        OR number_of_motorist_killed < 0
"""

[[checks]]
name = "allowed values: zip_code is a valid NYC ZIP code or NULL"
why  = "Unexpected zip codes names could lead to incorrect geographic classifications and inconsistent comparisons."
sql  = """
SELECT count(*) FROM raw
        WHERE zip_code IS NOT NULL
            AND NOT (
                -- Manhattan
                zip_code BETWEEN '10000' AND '10292'
    
                -- Staten Island
                OR zip_code BETWEEN '10301' AND '10314'
    
                -- The Bronx
                OR zip_code BETWEEN '10451' AND '10475'
    
                -- Queens
                OR zip_code BETWEEN '11004' AND '11109'
                OR zip_code BETWEEN '11351' AND '11697'
    
                -- Brooklyn
                OR zip_code BETWEEN '11201' AND '11256'
    
                OR zip_code = '99999'
    
                -- Nassau County, Long Island (Some get reported by NYPD)
                OR zip_code BETWEEN '11000' AND '11003'
                )
"""

[[checks]]
name = "freshness: newest crash is within 30 days"
why  = "If the most recent crash date is more than 30 days old, it could indicate that the NYC Open Data dataset has stopped updating or that the pipeline has failed."
sql  = """
SELECT CASE
        WHEN max(crash_date) >= current_date - INTERVAL 30 DAY
        THEN 0 ELSE 1 END
        FROM raw
"""


# -----------------------------------------------------------------------------
# 3. TABLES: what to build and publish to MotherDuck (at least three)
#    Each is a SELECT on raw, or on a table listed above it.
#    Start with one clean table, then build analysis tables from it:
#    a trend over time, a summary of key metrics, and a ranking.
#    Next week's AI app answers questions from these tables.
# -----------------------------------------------------------------------------

# (a) The clean table: one row per crash
[[tables]]
name = "car_crashes"
sql = """
SELECT
    crash_date,
    borough,
    zip_code,
    latitude,
    longitude,
    on_street_name,
    number_of_persons_injured,
    number_of_persons_killed,
    number_of_pedestrians_killed,
    number_of_cyclist_killed,
    number_of_motorist_killed,
    collision_id
FROM raw
WHERE zip_code <> 'UNSPECIFIED'      -- can't be placed in a zip code: dropped on purpose
"""

# (b) A trend: crashes per zip code per day
[[tables]]
name = "crashes_by_zip_day"
sql  = """
SELECT zip_code, crash_date, count(*) AS crashes
FROM car_crashes
GROUP BY zip_code, crash_date
"""

# (c) Key metrics: one row per borough
[[tables]]
name = "crashes_borough_summary"
sql  = """
SELECT borough,
       count(*)                                             AS total_crashes,
       round(count(*) / count(DISTINCT crash_date), 1)      AS avg_per_day,
       round(100.0 * count(*) / sum(count(*)) OVER (), 1)   AS pct_of_city,
       count(DISTINCT zip_code)                             AS zip_codes_affected
FROM car_crashes
GROUP BY borough
ORDER BY total_crashes DESC
"""

# (d) A ranking: the 10 deadliest ZIP codes for car crashes
[[tables]]
name = "crashes_deaths_top_zips"
sql  = """
SELECT zip_code,
        borough,
        SUM(number_of_persons_killed) AS total_fatalities,
        count(*) AS crashes
FROM car_crashes
WHERE number_of_persons_killed > 0
GROUP BY borough, zip_code
ORDER BY total_fatalities DESC
LIMIT 10
"""


# -----------------------------------------------------------------------------
# 4. REPORT (optional): questions the pipeline answers at the end of each run
#    Each is a plain-English question and the SQL that answers it, using the
#    tables above. The answers print in the run log. Try your findings here!
# -----------------------------------------------------------------------------
[[report]]
question = "Which boroughs have the most motor vehicle collisions?"
sql = """
SELECT borough, total_crashes, avg_per_day, pct_of_city
FROM crashes_borough_summary
ORDER BY total_crashes DESC
LIMIT 3
"""

[[report]]
question = "Which ZIP code has the most fatalities for car crashes?"
sql = """
SELECT zip_code, borough, total_fatalities
FROM crashes_deaths_top_zips
ORDER BY crashes DESC
LIMIT 10
"""

[[report]]
question = "What day, citywide, had the most car crashes?"
sql = """
SELECT crash_date, sum(crashes)::INT AS crashes
FROM crashes_by_zip_day
GROUP BY crash_date
ORDER BY crashes DESC
"""
